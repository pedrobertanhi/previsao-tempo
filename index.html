<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <title>Previsão do Tempo</title>
</head>

<body>
    <div class="background-container"></div>
    <div class="big-box">
        <input class="input-city" placeholder="Digite sua cidade">
        <button class="search-botton" onclick="clickBotton()"><img class="search-img" src="https://www.svgrepo.com/show/488200/find.svg" alt="Imagem Lupa"></button>
    <div class="med-box">
        <h2 class="city">Tempo em São Paulo</h2>
        <p class="country">BR</p>
        <p class="temp">21°C</p>

    <div class="small-box">
        <img class="img-prev" src="https://openweathermap.org/img/wn/04n.png" alt="Icone Nuvem">
        <p class="text-prev">Nublado</p>
    </div>

        <p class="humidity">Umidade: 76%</p>
        </div>
    </div>

    <script src="js/images.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
